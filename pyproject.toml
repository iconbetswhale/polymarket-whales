[project]
name = "iconbets-polymarket-wallet-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask",
  "requests",
  "gunicorn",
  "python-dotenv",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
simulation = [
  "numpy>=2,<3",
  "pytest>=8,<9",
]

[tool.vercel]
entrypoint = "app:app"
