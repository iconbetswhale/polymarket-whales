name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconbets-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm install --global vercel@55.0.0

      - name: Link production project
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify NoVIG production WebSocket
        env:
          TRACKER_JOB_SECRET: ${{ secrets.TRACKER_JOB_SECRET }}
        run: |
          market_response="$(curl --silent --show-error --max-time 25 \
            --request POST \
            --header "Authorization: Bearer $TRACKER_JOB_SECRET" \
            'https://iconbets-polymarket-wallet-tracker.vercel.app/api/provider-health/novig/websocket?mode=market')"
          market_id="$(NOVIG_MARKET_RESULT="$market_response" python - <<'PY'
          import json, os, re
          data = json.loads(os.environ["NOVIG_MARKET_RESULT"])
          market_id = str(data.get("market_id") or "")
          if not data.get("success") or not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", market_id):
              raise SystemExit(
                  "NoVIG market selection failed: "
                  f"{data.get('error_code') or 'invalid-market'} "
                  f"(HTTP {data.get('http_status') or 'none'})"
              )
          if data.get("credentials_exposed") or data.get("token_exposed"):
              raise SystemExit("NoVIG market response reported secret exposure")
          print(market_id)
          PY
          )"
          response="$(curl --silent --show-error --max-time 25 \
            --request POST \
            --header "Authorization: Bearer $TRACKER_JOB_SECRET" \
            "https://iconbets-polymarket-wallet-tracker.vercel.app/api/provider-health/novig/websocket?market_id=$market_id")"
          NOVIG_RESULT="$response" python - <<'PY'
          import json, os
          data = json.loads(os.environ["NOVIG_RESULT"])
          print(
              "NoVIG WebSocket: "
              f"connected={bool(data.get('connected'))} "
              f"book_snapshot={bool(data.get('book_snapshot_received'))} "
              f"update={bool(data.get('update_received'))} "
              f"types={','.join(data.get('message_types') or []) or 'none'} "
              f"http={data.get('http_status') or 'none'} "
              f"error={data.get('error_code') or 'none'}"
          )
          if not data.get("success"):
              raise SystemExit("NoVIG WebSocket smoke test failed")
          if data.get("credentials_exposed") or data.get("token_exposed"):
              raise SystemExit("NoVIG smoke response reported secret exposure")
          PY

      - name: Verify OddsEngine authentication and Advanced access
        env:
          TRACKER_JOB_SECRET: ${{ secrets.TRACKER_JOB_SECRET }}
        run: |
          response="$(curl --silent --show-error --fail-with-body --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $TRACKER_JOB_SECRET" \
            https://iconbets-polymarket-wallet-tracker.vercel.app/api/provider-health/odds-engine)"
          ODDSENGINE_RESULT="$response" python - <<'PY'
          import json, os

          data = json.loads(os.environ["ODDSENGINE_RESULT"])
          quota = data.get("quota") or {}
          print(
              "OddsEngine: "
              f"configured={bool(data.get('configured'))} "
              f"status={data.get('status') or 'unknown'} "
              f"rate_limit={quota.get('limit') or 'unknown'} "
              f"remaining={quota.get('remaining') or 'unknown'} "
              f"advanced={data.get('advancedAccess')} "
              f"books={int(data.get('bookRegistryCount') or 0)} "
              f"transport={data.get('snapshotTransport') or 'unknown'} "
              f"websocket={bool(data.get('websocketConnected'))}"
          )
          if data.get("credentials_exposed"):
              raise SystemExit("OddsEngine diagnostic reported secret exposure")
          if not data.get("configured") or data.get("status") == "unauthorized":
              raise SystemExit("OddsEngine production authentication failed")
          if data.get("status") != "authenticated":
              print(
                  "::warning::OddsEngine could not run a fresh base "
                  "authentication request; inspect quota and provider health."
              )
          if str(quota.get("remaining")) == "0":
              print(
                  "::warning::OddsEngine production quota was exhausted when "
                  "the deployment smoke ran."
              )
          if data.get("advancedAccess") is not True:
              print(
                  "::warning::OddsEngine authenticated, but its Advanced "
                  "endpoint probe was rejected or could not be verified."
              )
          PY

      - name: Reconcile Model Tracker and verify Discord delivery
        env:
          TRACKER_JOB_SECRET: ${{ secrets.TRACKER_JOB_SECRET }}
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $TRACKER_JOB_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"force":false}' \
            https://iconbets-polymarket-wallet-tracker.vercel.app/api/admin/model-tracker/reconcile)"
          DISCORD_RESULT="$response" python - <<'PY'
          import json, os
          data = json.loads(os.environ["DISCORD_RESULT"]).get("data", {})
          discord = data.get("discord_notifications", {})
          shadow = data.get("shadow", {})
          print(
              "Discord Model Tracker: "
              f"enabled={bool(discord.get('enabled'))} "
              f"configured={bool(discord.get('configured'))} "
              f"status={discord.get('status', 'unknown')} "
              f"error={discord.get('connection_error', 'none')} "
              f"delivered={int(discord.get('delivered') or 0)} "
              f"retrying={int(discord.get('retrying') or 0)} "
              f"failed={int(discord.get('failed') or 0)}"
          )
          print(
              "Shadow Tracker: "
              f"enabled={bool(shadow.get('enabled'))} "
              f"status={shadow.get('status', 'unknown')} "
              f"inserted={int(shadow.get('records_inserted') or 0)} "
              f"errors={int(shadow.get('errors') or 0)}"
          )
          if data.get("status") == "failed":
              raise SystemExit("Model/shadow reconciliation failed")
          if not shadow.get("enabled") or shadow.get("status") != "ACTIVE_FORWARD_TRACKING":
              raise SystemExit("Shadow Tracker is not active")
          if int(shadow.get("errors") or 0):
              raise SystemExit("Shadow Tracker reconciliation reported errors")
          PY

      - name: Reconcile LabTracker
        env:
          TRACKER_JOB_SECRET: ${{ secrets.TRACKER_JOB_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $TRACKER_JOB_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://iconbets-polymarket-wallet-tracker.vercel.app/api/admin/lab-tracker/reconcile

      - name: Verify durable Shadow Lab storage
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --silent --show-error --fail-with-body \
            --output "$response_file" \
            https://iconbets-polymarket-wallet-tracker.vercel.app/api/shadow-test
          python - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as response:
              data = json.load(response).get("data", {})
          shadow = data.get("shadow", {})
          persistence = data.get("persistence", {})
          print(
              "Shadow persistence: "
              f"enabled={bool(shadow.get('enabled'))} "
              f"status={shadow.get('status', 'unknown')} "
              f"backend={persistence.get('backend', 'unknown')} "
              f"persistent={bool(persistence.get('position_history_persistent'))}"
          )
          if not shadow.get("enabled") or shadow.get("status") != "ACTIVE_FORWARD_TRACKING":
              raise SystemExit("Shadow Tracker status verification failed")
          if persistence.get("backend") != "postgresql":
              raise SystemExit("Shadow position history is not using PostgreSQL")
          if not persistence.get("position_history_persistent"):
              raise SystemExit("Shadow position history is not persistent")
          PY

      - name: Send requested one-time Discord test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discord-test]')
        env:
          TRACKER_JOB_SECRET: ${{ secrets.TRACKER_JOB_SECRET }}
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $TRACKER_JOB_SECRET" \
            --header "Content-Type: application/json" \
            --data "{\"nonce\":\"${GITHUB_SHA:0:25}\"}" \
            https://iconbets-polymarket-wallet-tracker.vercel.app/api/admin/discord-notifications/test)"
          printf '%s' "$response" | python -c '
          import json, sys
          data = json.load(sys.stdin)
          print(
              "Discord test: "
              f"status={data.get('"'"'status'"'"', '"'"'unknown'"'"')} "
              f"delivered={bool(data.get('"'"'delivered'"'"'))}"
          )
          '

      - name: Verify ProphetX authentication
        env:
          TRACKER_JOB_SECRET: ${{ secrets.TRACKER_JOB_SECRET }}
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $TRACKER_JOB_SECRET" \
            https://iconbets-polymarket-wallet-tracker.vercel.app/api/provider-health/prophetx)"
          status="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("status", "connection failed"))')"
          printf 'ProphetX provider status: %s\n' "$status"
          if [ "$status" != "authenticated" ]; then
            printf '::warning::ProphetX provider status: %s\n' "$status"
          fi
