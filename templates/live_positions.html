{% extends "base.html" %}
{% block content %}
<section class="live-page il-data-grid-page" aria-labelledby="live-positions-title">
<header class="page-header il-page-header live-page-header"><div class="il-page-title"><p class="eyebrow">IN-PROGRESS MARKETS</p><div class="title-line"><h1 id="live-positions-title">Live Positions</h1><span class="result-badge" id="position-result-count" aria-live="polite">0 positions</span></div></div></header>
<section class="toolbar live-toolbar il-toolbar" aria-label="Live position filters">
  <label class="search-control"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><input id="position-search" type="search" placeholder="Search wallet, event, market"></label>
  <div class="live-filter-rail">
    <select id="position-wallet" aria-label="Wallet"><option value="">All wallets</option></select>
    <select id="position-sport" aria-label="Sport"><option value="">All sports</option></select>
    <select id="position-league" aria-label="League"><option value="">All leagues</option></select>
    <select id="position-market" aria-label="Market"><option value="">All markets</option></select>
    <select id="position-sort" aria-label="Sort positions"><option value="value-desc">Highest value</option><option value="value-asc">Lowest value</option><option value="start-asc">Start time</option><option value="wallet-asc">Wallet</option></select>
  </div>
</section>
<section class="panel table-panel live-table-panel il-panel"><div class="responsive-table"><table class="live-positions-table"><thead><tr><th>Wallet</th><th>Event / Market</th><th>Selection</th><th>Entry</th><th>Current</th><th>Position</th><th>Value</th><th>P&amp;L</th><th>Status</th></tr></thead><tbody id="positions-body"></tbody></table></div><div class="card-results" id="positions-cards" aria-live="polite"></div><div class="pagination" id="positions-pagination"></div></section>
</section>
{% endblock %}
