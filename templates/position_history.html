{% extends "base.html" %}
{% block content %}
<section class="history-page il-data-grid-page" aria-labelledby="history-title">
<header class="page-header history-page-header il-page-header"><div class="il-page-title"><p class="eyebrow">AUDIT TRAIL</p><div class="title-line"><h1 id="history-title">Position History</h1><span class="result-badge" id="history-result-count" aria-live="polite">0 events</span></div></div></header>
<section class="toolbar history-toolbar il-toolbar" aria-label="Position history filters">
  <label class="search-control"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><input id="history-search" type="search" placeholder="Search team, event, market, trader"></label>
  <div class="history-filter-rail">
    <select id="history-wallet" aria-label="Wallet"><option value="">All wallets</option></select>
    <select id="history-sport" aria-label="Sport"><option value="">All sports</option></select>
    <select id="history-league" aria-label="League"><option value="">All leagues</option></select>
    <select id="history-event-type" aria-label="Event type"><option value="">All Changes</option><option value="new_entry">New Entry</option><option value="size_increase">Size Increase</option><option value="size_decrease">Size Decrease</option><option value="full_exit">Full Exit</option></select>
    <label class="toolbar-date-field"><span>Start Date</span><input id="history-start" type="date" aria-label="Start Date"></label>
    <label class="toolbar-date-field"><span>End Date</span><input id="history-end" type="date" aria-label="End Date"></label>
    <select id="history-sort" aria-label="Sort history"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select>
  </div>
</section>
<section class="panel table-panel history-table-panel il-panel"><div class="responsive-table"><table class="history-table"><thead><tr><th>Detected</th><th>Change</th><th>Wallet</th><th>Event / Market</th><th>Selection</th><th>League</th><th>Position Value</th></tr></thead><tbody id="history-body"></tbody></table></div><div class="pagination" id="history-pagination"></div></section>
</section>
{% endblock %}
